# Карточка dé EV Charger. Требуется custom:button-card (HACS → Dashboard).
# Дашборд → ✎ → Добавить карточку → Вручную → вставить целиком.
# Хелперы input_button и потоки Node-RED не нужны: кнопки вызывают сущности напрямую,
# защита от повторных нажатий (5 с) встроена в интеграцию.
type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.de_ev_charger_status
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    triggers_update:
      - sensor.de_ev_charger_status
      - sensor.de_ev_charger_vehicle
      - sensor.de_ev_charger_voltage
      - sensor.de_ev_charger_current
      - sensor.de_ev_charger_power
      - sensor.de_ev_charger_session_energy
      - sensor.de_ev_charger_session_duration
      - switch.de_ev_charger_schedule
      - switch.de_ev_charger_nfc
    styles:
      card:
        - padding: 8px 10px
        - border-radius: 22px
      grid:
        - grid-template-areas: '"status" "energy" "metrics" "flags"'
        - grid-template-columns: 1fr
        - row-gap: 6px
      custom_fields:
        status:
          - color: '#009bb6'
          - font-size: 17px
          - font-weight: 700
          - white-space: normal
        energy:
          - font-size: 16px
        metrics:
          - width: 100%
        flags:
          - color: '#777'
          - font-size: 12px
          - white-space: normal
    custom_fields:
      status: |
        [[[
          const st = states['sensor.de_ev_charger_status'];
          const s = st?.state;
          const text = s === 'scheduled' ? 'Ожидание по расписанию'
            : s === 'charging' ? 'Зарядка идёт'
            : (!s || s === 'unavailable') ? 'Устройство недоступно'
            : 'Статус: ' + (st.attributes?.code ?? s);
          const veh = states['sensor.de_ev_charger_vehicle'];
          const cp = veh?.attributes?.cp;
          const map = {
            disconnected: ['mdi:car-off', 'Машина не подключена', '#81959c'],
            connected: ['mdi:car-connected', 'Машина подключена, заряд не подаётся', '#009bb6'],
            charging: ['mdi:car-electric', 'Заряд подаётся', '#51b654'],
          };
          const [icon, title, color] = map[veh?.state]
            || ['mdi:help-circle-outline', 'Состояние подключения неизвестно', '#009bb6'];
          return `<span style="display:flex;align-items:center;justify-content:center;position:relative;width:100%;min-height:24px;padding:0 28px;box-sizing:border-box">`
            + `<ha-icon icon="${icon}" title="${title} (CP ${cp ?? '—'} В)" aria-label="${title}" style="position:absolute;left:4px;top:50%;transform:translateY(-50%);--mdc-icon-size:22px;color:${color};flex-shrink:0"></ha-icon>`
            + `<span>${text}</span></span>`;
        ]]]
      energy: |
        [[[
          const sec = Number(states['sensor.de_ev_charger_session_duration']?.state);
          const t = Number.isFinite(sec) ? Math.floor(sec) : null;
          const duration = t === null ? '—'
            : [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(v => String(v).padStart(2, '0')).join(':');
          const e = Number(states['sensor.de_ev_charger_session_energy']?.state);
          return `<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px">`
            + `<span>Длительность: <b style="color:#51b654">${duration}</b></span>`
            + `<span>Заряжено: <b style="color:#51b654">${Number.isFinite(e) ? e.toFixed(1) : '—'}</b> кВт⋅ч</span></div>`;
        ]]]
      metrics: |
        [[[
          const read = (id, d) => { const v = Number(states[id]?.state); return Number.isFinite(v) ? v.toFixed(d) : '—'; };
          const items = [
            ['Напряжение', 'sensor.de_ev_charger_voltage', 'В', 0],
            ['Ток', 'sensor.de_ev_charger_current', 'А', 1],
            ['Мощность', 'sensor.de_ev_charger_power', 'кВт', 1],
          ];
          return `<div style="display:flex;justify-content:space-between;gap:8px;background:var(--secondary-background-color);border:2px solid #d5d8da;border-radius:18px;padding:6px 4px">`
            + items.map(([label, id, unit, d]) =>
                `<div style="flex:1;text-align:center"><div style="font-size:11px;color:var(--secondary-text-color);margin-bottom:3px">${label} (${unit})</div>`
                + `<div style="font-size:18px;font-weight:700;color:var(--primary-text-color)">${read(id, d)}</div></div>`).join('')
            + `</div>`;
        ]]]
      flags: |
        [[[
          return 'Расписание: ' + (states['switch.de_ev_charger_schedule']?.state === 'on' ? 'включено' : 'выключено')
            + ' · RFID: ' + (states['switch.de_ev_charger_nfc']?.state === 'on' ? 'включён' : 'выключен');
        ]]]
  - type: custom:button-card
    show_icon: false
    show_name: false
    tap_action:
      action: none
    styles:
      card:
        - padding: 0
        - border: none
        - box-shadow: none
        - background: transparent
      grid:
        - grid-template-areas: '"on nfc off"'
        - grid-template-columns: 2fr 1fr 2fr
        - column-gap: 6px
      custom_fields:
        'on':
          - width: 100%
        nfc:
          - width: 100%
        'off':
          - width: 100%
    custom_fields:
      'on':
        card:
          type: custom:button-card
          entity: button.de_ev_charger_charge_now
          name: Включить зарядку
          icon: mdi:power
          tap_action:
            action: call-service
            service: button.press
            service_data:
              entity_id: button.de_ev_charger_charge_now
          styles:
            card:
              - height: 40px
              - padding: 4px
              - border-radius: 20px
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 20px 1fr
            icon:
              - width: 18px
              - color: '#50769a'
            name:
              - font-size: 11px
              - white-space: normal
      nfc:
        card:
          type: custom:button-card
          entity: switch.de_ev_charger_nfc
          name: NFC
          icon: mdi:checkbox-blank-outline
          tap_action:
            action: call-service
            service: switch.toggle
            service_data:
              entity_id: switch.de_ev_charger_nfc
          state:
            - value: 'on'
              icon: mdi:checkbox-marked
              color: '#50769a'
          styles:
            card:
              - height: 40px
              - padding: 4px
              - border-radius: 20px
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 18px 1fr
            icon:
              - width: 16px
            name:
              - font-size: 11px
      'off':
        card:
          type: custom:button-card
          entity: switch.de_ev_charger_schedule
          name: По расписанию
          icon: mdi:calendar-clock
          tap_action:
            action: call-service
            service: switch.turn_on
            service_data:
              entity_id: switch.de_ev_charger_schedule
          styles:
            card:
              - height: 40px
              - padding: 4px
              - border-radius: 20px
            grid:
              - grid-template-areas: '"i n"'
              - grid-template-columns: 20px 1fr
            icon:
              - width: 18px
              - color: '#50769a'
            name:
              - font-size: 11px
              - white-space: normal
  - type: tile
    entity: number.de_ev_charger_charge_current
    name: Ток зарядки
    icon: mdi:current-ac
    horizontal: true
    features:
      - type: numeric-input
        style: slider
    features_position: inline
  - type: custom:button-card
    show_name: false
    show_icon: false
    tap_action:
      action: none
    styles:
      card:
        - background: var(--secondary-background-color)
        - border-radius: 22px
        - padding: 6px
        - '--primary-color': '#50769a'
      grid:
        - grid-template-areas: '"start end"'
        - grid-template-columns: 1fr 1fr
        - column-gap: 6px
      custom_fields:
        start:
          - width: 100%
        end:
          - width: 100%
    custom_fields:
      start:
        card:
          type: custom:button-card
          entity: time.de_ev_charger_schedule_start
          name: Начало
          show_icon: false
          show_state: true
          state_display: '[[[ return entity?.state?.slice(0, 5) || "—"; ]]]'
          tap_action:
            action: more-info
          styles:
            card:
              - height: 40px
              - padding: 4px 8px
              - border-radius: 10px
              - background: var(--ha-card-background, var(--card-background-color))
            grid:
              - grid-template-areas: '"n s"'
              - grid-template-columns: 1fr 1fr
            name:
              - font-size: 12px
              - color: var(--secondary-text-color)
            state:
              - font-size: 18px
              - font-weight: 600
      end:
        card:
          type: custom:button-card
          entity: time.de_ev_charger_schedule_end
          name: Окончание
          show_icon: false
          show_state: true
          state_display: '[[[ return entity?.state?.slice(0, 5) || "—"; ]]]'
          tap_action:
            action: more-info
          styles:
            card:
              - height: 40px
              - padding: 4px 8px
              - border-radius: 10px
              - background: var(--ha-card-background, var(--card-background-color))
            grid:
              - grid-template-areas: '"n s"'
              - grid-template-columns: 1fr 1fr
            name:
              - font-size: 12px
              - color: var(--secondary-text-color)
            state:
              - font-size: 18px
              - font-weight: 600
